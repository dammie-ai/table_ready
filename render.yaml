databases:
  - name: tableready-db
    databaseName: tableready_db
    user: tableready_admin
    plan: free
    region: oregon

services:
  - type: web
    name: tableready-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: tableready-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tableready-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tableready-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: tableready-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tableready-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:19006
      - key: PORT
        value: 8001

  - type: web
    name: tableready-staff-web
    runtime: static
    branch: main
    buildCommand: npm install --legacy-peer-deps && npm run build --workspace=frontend/apps/staff-web
    staticPublishPath: frontend/apps/staff-web/dist
    envVars:
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        value: pk_test_51TvFSeD5QLIB6xlPLn5qDHwfafeKdNB0kz9xcL94Rr80zej76G0y5P26xhRJb1JBb75Mkj2L6OlFxPDGtKrMFrg400r5KfasRk
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
